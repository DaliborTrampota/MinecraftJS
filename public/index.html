<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Minecraft JS</title>
  </head>
  <body oncontextmenu="return false;">
      <div id="target"></div>
      <div id="debug"></div>

      <div id="menu">
        <div id="loading-screen">

        </div>
        <div id="title">
            <h1>Voxel Game</h1>
            <h3>Made by Dalibor Trampota</h3>
        </div>
        <div id="buttons">
            <button id="spawn">Spawn</button>
            <select id="world-type">
                <option>World type</option>
            </select>
        </div>
        <div id="controls">
            <div class="c-group">
                <span id="c-move" data-w="3">
                    <kbd class="invi"></kbd><kbd>W</kbd><kbd class="invi"></kbd>
                    <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
                </span>
                Movement
            </div>

            <div class="c-group">
                <kbd>Shift</kbd>
                Sprint
            </div>

            <div class="c-group">
                <kbd>E</kbd>
                Open inventory
            </div>

            <div class="c-group">
                <kbd>F</kbd>
                Fly
            </div>

            <div class="c-group">
                <kbd>P</kbd>
                Debug panel
            </div>

            <div class="c-group">
                <kbd>Space</kbd>
                Jump/Fly up
            </div>

            <div class="c-group">
                <kbd>G</kbd>
                Change gamemode
            </div>

            <div class="c-group">
                <span>
                    <kbd>0</kbd>-<kbd>9</kbd>
                </span>
                Hotbar
            </div>

            <div class="c-group mouse">
                <span>
                    <kbd>L</kbd><kbd>R</kbd>
                </span>
                Destroy/Place
            </div>
        </div>
      </div>

      <div id="gui" draggable="false">
      </div>

      <div id="crosshair">
        <img src="resources/crosshair.png">
      </div>
      <div id="hotbar"></div>
      <div id="photo-booth"></div>

      <script src="src/index.js" type="module"></script>
      
  </body>
</html>
